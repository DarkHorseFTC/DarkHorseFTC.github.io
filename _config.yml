title: DarkHorse Robotics
description: >-
  DarkHorse Robotics — FIRST Tech Challenge Team 33477 at Meridian Creek Middle School,
  Wilsonville, Oregon. BIOBUZZ 2026-27 season.
url: "https://mcmsrobotics.org"

# Every mailto: on the site reads this one value.
email: coach@mcmsrobotics.org

markdown: kramdown

collections:
  portfolio:
    output: true
    permalink: /portfolio/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: portfolio
    values:
      layout: portfolio-entry

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
