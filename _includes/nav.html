<script>
  document.addEventListener('click', function (e) {
    var t = document.getElementById('nav-toggle');
    if (t && t.checked && e.target.closest('nav a')) t.checked = false;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('nav-burger')) {
      var t = document.getElementById('nav-toggle');
      t.checked = !t.checked;
    }
  });
</script>
